# 供 livekit-wakeword 0.3.0 训练命令直接读取，不由 Runtime 加载。
# 依赖隔离安装: livekit-wakeword[train,eval,export,voxcpm]
# 使用: livekit-wakeword setup --config config/唤醒词训练.yaml
#       livekit-wakeword run config/唤醒词训练.yaml
# 未训练/未离线评测；中文合成音频不可代替真实多人房间录音。
model_name: xiaoannie
target_phrases:
  - "小安妮"
tts_backend: voxcpm
n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
# 中文须手写近音负样本；含完整“小安妮”的语句不得作为负样本。
custom_negative_phrases:
  - "安妮"
  - "小安宁"
  - "小安娜"
  - "小安尼"
  - "小安迪"
  - "小安你"
  - "小艾妮"
  - "小爱妮"
  - "小安啊"
  - "小安呀"
  - "笑安妮"
  - "找安妮"
  - "安宁"
  - "小阿妮"
  - "叫安妮"
  - "早安你"
voxcpm_tts:
  # 先覆盖年龄、性别、音高、语速、普通话/口音；
  # 正式大规模训练前扩大至50-100种设计描述并经真人留出集验证。
  voice_design_prompts:
    - "Young adult woman, standard Mandarin, clear medium pitch, calm tempo"
    - "Young adult man, standard Mandarin, low pitch, slow deliberate speech"
    - "Middle-aged woman, warm low pitch, fast natural Mandarin"
    - "Middle-aged man, higher nasal pitch, lively expressive Mandarin"
    - "Senior woman, soft slightly breathy voice, measured pace"
    - "Senior man, rough low voice, slightly slow Mandarin"
    - "Teenage girl, bright high voice, quick Mandarin"
    - "Teenage boy, changing pitch, brisk colloquial Mandarin"
    - "Adult woman, Sichuan-accented Mandarin, natural conversational pace"
    - "Adult man, Shaanxi-accented Mandarin, resonant medium pitch"
    - "Adult woman, Northeast-accented Mandarin, energetic loud voice"
    - "Adult man, Shandong-accented Mandarin, steady deep tone"
    - "Adult woman, Henan-accented Mandarin, quick colloquial style"
    - "Adult man, Tianjin-accented Mandarin, animated rhythm"
    - "Adult woman, Cantonese-accented Mandarin, precise slow speech"
    - "Adult man, Wu-accented Mandarin, gentle soft articulation"
    - "Adult woman, whispery very quiet voice, close-microphone style"
    - "Adult man, raised urgent voice, rapid syllables"
    - "Adult woman, smiling bright voice, playful intonation"
    - "Adult man, tired monotone, low energy, slow words"
    - "Child girl, very high youthful voice, careful Mandarin"
    - "Child boy, youthful medium-high voice, playful fast Mandarin"
    - "Adult woman, husky voice, spontaneous natural Mandarin"
    - "Adult man, clear tenor, formal broadcaster Mandarin"
augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]
model:
  model_type: conv_attention
  model_size: medium
steps: 100000
target_fp_per_hour: 0.2
