# V2 当前保留的 Provider 默认值。
# 未到对应阶段前不代表 Provider 已接入或已在线。

[llm]
provider = "dashscope"
api_key_env = "DASHSCOPE_API_KEY"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
chat_completions_url = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"

[llm.main]
model = "qwen3.8-flash"
stream = true
enable_thinking = false
temperature = 0.68
top_p = 0.9
max_tokens = 1024

[llm.gate]
model = "qwen-flash"
timeout_ms = 1500

[llm.inquiry]
model = "qwen3.8-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
enable_thinking = true
reasoning_effort = "low"
timeout_sec = 8.0
max_concurrent = 1

[llm.dialogue_state]
model = "qwen3.8-flash"
timeout_sec = 4.0

# 后台长期记忆：只在有效用户回合结束后抽取，不阻塞Realtime。
[memory]
extract_model = "qwen3.8-flash"
embedding_model = "text-embedding-v4"
embedding_dimensions = 256

[tts]
provider = "qwen_audio"
sentence_min_chars = 4
sentence_max_chars = 30
first_min_chars = 2

[tts.qwen_audio]
model = "qwen-audio-3.0-tts-flash"
voice = "qwen-audio-3.0-tts-flash-annie-9417629004fa4493a2c172b24d3e764a"
sample_rate = 24000

[vision]
provider = "minicpm_local"

[vision.minicpm_local]
base_url = "http://192.168.1.47:1234/v1"
model = "minicpm-v-4.6"
api_key_env = "MINICPM_API_KEY"
max_images = 8
image_max_side = 448
jpeg_quality = 72

[vision.eye]
model = "minicpm-v-4.6"
fresh_sec = 30
max_chars = 200

[weather.amap]
api_key_env = "AMAP_WEATHER_API_KEY"
default_adcode = "110000"
default_city = "北京市"
timeout_ms = 1200
http_retries = 0 # 语音热路径不串行重试；失败返回诊断，避免放大延迟与 QPS
live_cache_sec = 180
forecast_cache_sec = 1800
district_cache_sec = 86400
