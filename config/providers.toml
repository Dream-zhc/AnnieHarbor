# V2 当前保留的 Provider 默认值。
# 未到对应阶段前不代表 Provider 已接入或已在线。

[llm]
provider = "dashscope"
api_key_env = "DASHSCOPE_API_KEY"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
chat_completions_url = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"

# Realtime 主脑（ASR/smart_turn/对话/Function Calling）。ANNIE_REALTIME_MODEL 可临时覆盖。
# 只允许同一 wire 协议族：qwen-audio-3.0-realtime-flash / 3.0-realtime-plus / 3.1-realtime-plus。
# 2026-10-13 实测：语音首响与 3.0-flash 持平，上下文与工具使用更好；文字输入首字慢约150ms。
# 回退只需改回 qwen-audio-3.0-realtime-flash。证据见 docs/开发记录/2026-10-13/。
[realtime]
model = "qwen-audio-3.1-realtime-plus"

# 决策模型（TypeSafe System One）：判断“是不是对机器人说的”、自发表情。
# prefer = "d3"：自建 d3-NVFP4 能答就用它（对话对象 + 表情）；未配置、云机未开、预热中或出错时
#   自动回退阿里：对话对象走 [llm.addressee] qwen-flash，表情走下面的 decision-model-preview。
# prefer = "dashscope"：只用阿里，不连 d3。
# 阿里地址含业务空间，只放 .env 的 ANNIE_DECISION_URL；d3 地址与 token 只放 .env 的
# ANNIE_D3_URL / ANNIE_D3_TOKEN。两者都未配置时对话对象只走 qwen-flash，自发表情不启用。
[decision]
prefer = "d3"
model = "decision-model-preview"
timeout_ms = 1500
expression_threshold = 0.55

# 2026-10-21 用 10-20/10-21 演示原话重放：对话对象（追问版问题）可计分 39 句准确 87%，
# 旁人对话误回 3/12（qwen-flash 7.5/12），模型耗时约 160ms；表情比旧模型选得多，
# 阈值 0.55 时 76 轮选 19 次、0.7 时 12 次。证据见 docs/开发记录/2026-10-21/d3决策模型评测.md。
[decision.d3]
model = "d3-NVFP4"
timeout_ms = 1500
expression_threshold = 0.7

[llm.main]
model = "qwen3.8-flash"
stream = true
enable_thinking = false
temperature = 0.68
top_p = 0.9
max_tokens = 1024

[llm.gate]
model = "qwen-flash"
timeout_ms = 1500

[llm.addressee]
# 追问窗口里“这句话是不是对小安妮说的”。2026-10-21 用户确认由决策模型改为 qwen-flash：
# 用 10/16、10/20 真实原话重放，该回的 93%（原约 57%），旁人闲聊误回 19%（原约 20%），约 280ms。
# 失败或超时按“回复”处理。[decision] prefer = "d3" 且 d3 在线时由 d3 判断，本项是阿里保底。
model = "qwen-flash"
timeout_ms = 1200

[llm.inquiry]
model = "qwen3.8-max-0902"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
enable_thinking = true
reasoning_effort = "low"
timeout_sec = 12.0
max_concurrent = 1

[llm.dialogue_state]
model = "qwen3.8-flash"
timeout_sec = 4.0

# 后台长期记忆：只在有效用户回合结束后抽取，不阻塞Realtime。
[memory]
extract_model = "qwen3.8-flash"
embedding_model = "text-embedding-v4"
embedding_dimensions = 256

[tts]
provider = "qwen_audio"
sentence_min_chars = 4
sentence_max_chars = 30
first_min_chars = 2

[tts.qwen_audio]
model = "qwen-audio-3.0-tts-flash"
voice = "qwen-audio-3.0-tts-flash-annie-9417629004fa4493a2c172b24d3e764a"
sample_rate = 24000

[vision]
provider = "minicpm_local" 

[vision.minicpm_local]
base_url = "http://192.168.1.47:1234/v1"
model = "minicpm-v-4.6"
api_key_env = "MINICPM_API_KEY"
max_images = 8
image_max_side = 448
jpeg_quality = 72

[vision.eye]
model = "minicpm-v-4.6"
fresh_sec = 30
max_chars = 200

[weather.amap]
api_key_env = "AMAP_WEATHER_API_KEY"
default_adcode = "110000"
default_city = "北京市"
timeout_ms = 2400 # 本机1.2s曾超时，2.4s保留上界；不加串行重试
http_retries = 0 # 语音热路径不串行重试；失败返回诊断，避免放大延迟与 QPS
live_cache_sec = 180
forecast_cache_sec = 1800
district_cache_sec = 86400
