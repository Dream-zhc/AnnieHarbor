# Java Room Server。一个机器人绑定一个 room；该 room 下的 main/tts/mic/visualdata/vision/sam 都属于这个机器人。

[server]
base_url = "ws://192.168.1.47:8090/robot/roomv2"
room_root = "ws://192.168.1.47:8090/robot"
subscribe_types = ["*"]
reconnect_min_sec = 1.0
reconnect_max_sec = 15.0
connect_timeout_sec = 3.0

[rooms]
main = "reb_main"
tts = "reb_tts"
mic = "reb_mic"
visualdata = "reb_visualdata"
vision = "reb_vision"
sam = "reb_sam"
visualllm = "reb_visualllm"
voice = "reb_voice" # 同一个 roomv2 下，麦克风/扬声器控制与回执，不承载 PCM
display = "reb_display" # 大屏内部事件。异步旁路，不承载 PCM，也不参与播放控制

[urls]
main = "ws://192.168.1.47:8090/robot/roomv2/reb_main"
tts = "ws://192.168.1.47:8090/robot/roomv2/reb_tts"
mic = "ws://192.168.1.47:8090/robot/roomv2/reb_mic"
visualdata = "ws://192.168.1.47:8090/robot/roomv2/reb_visualdata"
vision = "ws://192.168.1.47:8090/robot/roomv2/reb_vision"
sam = "ws://192.168.1.47:8090/robot/roomv2/reb_sam"
visualllm = "ws://192.168.1.47:8090/robot/roomv2/reb_visualllm"
voice = "ws://192.168.1.47:8090/robot/roomv2/reb_voice"
display = "ws://192.168.1.47:8090/robot/roomv2/reb_display"

[protocol]
asr_types = ["asr", "ASR_RESULT"]
asr_text_keys = ["text", "result", "asr", "transcript", "content"]
tts_message_type = "tts"
tts_frame_max_age_ms = 2000
tts_backpressure_high_ms = 1500
tts_backpressure_low_ms = 600
tts_playback_status_stale_ms = 3000
visuals_command_queue_max = 500
visuals_max_message_bytes = 524288
visuals_raw_history_max = 100
visuals_event_history_max = 200
visual_command_timeout_ms = 30000
visual_state_ttl_ms = 60000
