# V2 后续阶段仍需要的业务默认值。
# 当前Phase 2仅消费PCM准入所需配置；其余开关在对应阶段接入时再读取。

[features]
robot_output_enabled = true
asr_forward = true
web_forward = true
eye_enabled = true

[duplex]
enabled = false
mode = "wake"
wake_wait_ms = 5000
# 机器人说完后免唤醒继续听的时间（真实扬声器播完才开始计时）。
# 2026-10-22 实测 20 秒偏短（回复后 25～54 秒内又得喊名字），改为上限 30 秒。
followup_ms = 30000
# 决策模型判定“旁人之间在聊、不是对机器人说”时窗口重新计时，
# 但从窗口打开起最多继续听这么久，之后需要重新喊“小安妮”。
side_talk_listen_ms = 120000
pcm_source = "web"

[tts]
provider = "qwen_audio"
# V1 tts_voice=null，表示使用 provider 默认音色；TOML 不写 null。

[conversation]
history_turns = 20
# Realtime cloud inference window, separate from SQLite / local history.
# Provider default is 20; ordinary voice dialogue starts smaller (5–10 per Alibaba).
realtime_history_turns = 8
# Startup-only history injection uses characters, NOT an exact token limit.
realtime_restore_char_budget = 3000
turn_cooldown_ms = 1500
sensor_rearm_gap_ms = 3000

[inner_life]
# 小安妮自己的心情、精力和“今天的真实经历”（2026-10-26 第一版，见 docs/开发记录/2026-10-26/）。
# 只由真实事件改变：触摸、认出熟人、每轮对话（后台问一次决策模型）、时间和久无人理。
# .env 的 ANNIE_INNER_LIFE_ENABLED=1/0 覆盖本项。
# 2026-10-27 用户确认默认打开（真实对话回放验证不劣于改动前，见开发记录）。
enabled = true
# 最后一句之后多久算这段对话结束，写成一句带人名的经历摘要（秒）。
conversation_close_seconds = 120
# 经历保留天数；提示词里只放今天的。
keep_days = 7

[motions]
# 实时交互里的身体动作（2026-10-26）。没唤醒时的待机动作由嵌入式自己负责，这里只管醒着、在交流时：
# listening：用户开口约 0.7 秒后，从倾听组（倾听、点头、侧耳听、轻歪头）选一个；
# speaking：她说的每句话由决策模型选一个动作或不配，等扬声器快播到那句时再发；
# reactions：一轮对话让她心情明显变化，说完后由决策模型挑一个不出声的小动作。
# 真动作仍需 .env 的 ANNIE_ACTIONS_ENABLED=1；.env 的 ANNIE_INTERACTION_MOTIONS_ENABLED=1/0 覆盖本项。
# 2026-10-27 用户确认默认打开；电机声对识别与回声消除的影响、动作时机仍待真机统一测试。
enabled = true
listening = true
speaking = true
reactions = true
# 每轮回复最多配几个动作（含原有的自发表情）。
per_reply = 3

[vision]
companion_context_enabled = true
shared_attention_ttl_ms = 45000
realtime_on_query = false
attach_frame_to_main_brain = true
# 认出的熟人来到面前时主动打招呼；同一个人在这段时间内只打一次（分钟）。挥手不触发回应。
greet_known_cooldown_minutes = 30

[vision.intent]
# 用户要她现在去看（“你看看左边有什么”“你看到了什么”“你瞅瞅我拿的什么”）时：
# 有看向动作就先立即转头（action_trigger offset_ms=-1），等嵌入式 action.finished，
# 再经 reb_main 发 vision.intent 请视觉端看新画面，拿到描述才让实时模型回答；这一轮回复先压住。
# 协议见 docs/规范/视觉意图协议.md。视觉端对接好之前保持关闭：开着而视觉端不回，
# 每个视觉问题都要多等 deadline_ms 才回答。.env 的 ANNIE_VISION_INTENT_ENABLED=1/0 覆盖本项。
enabled = false
# 让视觉端用哪个模型看：cloud = 阿里云视觉模型；local = 视觉端本地模型。
route = "cloud"
# 视觉端从收到请求起最多这么久内回描述（毫秒）；超时就按每秒一条的本地画面照常回答。
deadline_ms = 3500
# 看向动作的回执在动作时长之外最多再等多久（毫秒）；等不到也照常取画面。
action_receipt_extra_ms = 1200

[vision.face]
# 各机器人自己摄像头的视觉服务（人脸库接口）。配置了的机器人，对话里可以说“记住我，我叫…”和“忘掉我”。
# 视觉端 192.168.1.13 是 A 机器人（roomv2）的摄像头；B 机器人暂无。
api_urls = { "annie-a" = "http://192.168.1.13:8766" }
# 每次注册采集的样本数（视觉端 1–100，默认 18）
samples = 18
