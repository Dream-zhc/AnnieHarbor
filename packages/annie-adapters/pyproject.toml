[project]
name = "annie-adapters"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["annie-core", "httpx>=0.28,<1", "websockets>=15.0.1,<16", "numpy>=1.26,<3", "sherpa-onnx==1.13.8"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annie_adapters"]

[tool.uv.sources]
annie-core = { workspace = true }
