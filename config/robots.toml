# 当前 MIC_AUDIO 无帧内设备身份；Phase 2真实Gateway用 room_id 作为输入隔离边界。
# 每台机器人的开关（不写就取括号里的默认值）：
#   wake_enabled    唤醒词（true）；false 时不等唤醒词，Room 音频直接进阿里实时全双工
#   aec_enabled     云端回声消除（false）；还需要本机 .env 的 ANNIE_CLOUD_AEC_ENABLED=1 总开关
#   mouth_enabled   嘴型（true）；false 时不收嘴型消息，工作台显示“已关闭”
#   camera_enabled  摄像头（true）；视觉描述和“先看再答”
#   actions         能做的动作 script_id（不写就用全局白名单）
#   livekit_room_of 摄像头复用哪台机器人的 LiveKit 房间（本机没配 ANNIE_EXHIBIT_LIVEKIT_ROOM_<ID> 时）
[[robots]]
robot_id = "annie-a"
room_id = "roomv2"
persona_id = "annie"
enabled = true
listen_enabled = true
publish_enabled = false
queue_capacity = 16
fake_delay_ms = 800
audio_queue_capacity = 25
audio_max_age_ms = 500
aec_enabled = true

[[robots]]
robot_id = "annie-b"
room_id = "roomv3"
persona_id = "annie"
enabled = true
listen_enabled = true
publish_enabled = false
queue_capacity = 16
fake_delay_ms = 800
audio_queue_capacity = 25
audio_max_age_ms = 500

# 小头：独立房间 roomv4，不要唤醒词、不要嘴型，摄像头用大头的 LiveKit 房间。
[[robots]]
robot_id = "annie-small"
room_id = "roomv4"
persona_id = "annie"
enabled = true
listen_enabled = true
publish_enabled = false
queue_capacity = 16
fake_delay_ms = 800
audio_queue_capacity = 25
audio_max_age_ms = 500
wake_enabled = false
aec_enabled = false
mouth_enabled = false
camera_enabled = true
livekit_room_of = "annie-a"
actions = ["shake_head", "look_left", "look_right", "fast_double_blink", "wink_left", "wink_right"]
