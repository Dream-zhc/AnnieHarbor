[project]
name = "annie-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["annie-core", "annie-brain", "annie-adapters", "annie-observability", "annie-web", "uvicorn>=0.34,<1", "aec-audio-processing==1.0.1", "soxr>=0.5,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annie_runtime"]

[tool.uv.sources]
annie-core = { workspace = true }
annie-brain = { workspace = true }
annie-adapters = { workspace = true }
annie-observability = { workspace = true }
annie-web = { workspace = true }
