[project]
name = "annie-harbor"
version = "0.1.0"
description = "Annie Harbor Phase 3: isolated sessions and conversation ledger with Fake brain"
requires-python = ">=3.11,<3.12"
dependencies = ["annie-runtime"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/runtime", "packages/annie-core", "packages/annie-brain", "packages/annie-adapters", "packages/annie-observability", "packages/annie-web"]

[tool.uv.sources]
annie-runtime = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "docs/phase0/2026-09-17"]
addopts = "--import-mode=importlib"
cache_dir = "var/pytest"

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["apps/**/*.py", "packages/**/*.py", "tests/test_phase*.py"]
cache-dir = "var/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
