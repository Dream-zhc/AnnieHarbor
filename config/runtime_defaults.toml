# V2 后续阶段仍需要的业务默认值。
# 当前Phase 2仅消费PCM准入所需配置；其余开关在对应阶段接入时再读取。

[features]
robot_output_enabled = true
asr_forward = true
web_forward = true
eye_enabled = true

[duplex]
wake_wait_ms = 5000
# 机器人说完后免唤醒继续听的时间（真实扬声器播完才开始计时）。
# 2026-10-22 实测 20 秒偏短（回复后 25～54 秒内又得喊名字），改为上限 30 秒。
followup_ms = 30000
# 决策模型判定“旁人之间在聊、不是对机器人说”时窗口重新计时，
# 但从窗口打开起最多继续听这么久，之后需要重新喊“小安妮”。
side_talk_listen_ms = 120000
pcm_source = "web"

[tts]
provider = "qwen_audio"
# V1 tts_voice=null，表示使用 provider 默认音色；TOML 不写 null。

[conversation]
history_turns = 20
# Realtime cloud inference window, separate from SQLite / local history.
# Provider default is 20; ordinary voice dialogue starts smaller (5–10 per Alibaba).
realtime_history_turns = 8
# Startup-only history injection uses characters, NOT an exact token limit.
realtime_restore_char_budget = 3000
turn_cooldown_ms = 1500
sensor_rearm_gap_ms = 3000

[events.habituation]
# 同一处被连着碰、有人连着凑近、气味一直在（11-16 16:20 起 6 分钟 15 次靠近、15 句俏皮话）：
# 第 1 次照常说，第 2 次只应几个字，第 3 次起只做一个不出声的小动作（摸不同部位分开算）；
# 这类刺激停了这么久（秒）以后再来，又当新鲜事。用力按（4 级以上）最多只降到“几个字”。
enabled = true
quiet_seconds = 120

[inner_life]
# 小安妮自己的心情、精力和“今天的真实经历”（2026-10-26 第一版，见 docs/开发记录/2026-10-26/）。
# 只由真实事件改变：触摸、认出熟人、每轮对话（后台问一次决策模型）、时间和久无人理。
# .env 的 ANNIE_INNER_LIFE_ENABLED=1/0 覆盖本项。
# 2026-10-27 用户确认默认打开（真实对话回放验证不劣于改动前，见开发记录）。
enabled = true
# 最后一句之后多久算这段对话结束，写成一句带人名的经历摘要（秒）。
conversation_close_seconds = 120
# 经历保留天数；提示词里只放今天的。
keep_days = 7

[memory]
# 长期记忆（2026-11-03 改版，借鉴 DeepSeek Harness 社区插件 Aurabot，见 docs/开发记录/2026-11-03/）。
# 每句话在本地检索相关旧事（中文二元词 + BM25 + 遗忘曲线，不调云端），下一句回复带上；
# 一段对话安静下来后，后台把它和相关旧记忆一起交给模型，新增/合并/标记过时（过时的可在工作台恢复）。
# 不区分是谁说的：硬件还分不清正在说话的人。.env 的 ANNIE_MEMORY_ENABLED=0 关闭，需要 DASHSCOPE_API_KEY。
# 最后一句之后安静多久开始整理这段对话（秒）；也是“本次对话前情”清空的间隔。
consolidate_idle_seconds = 120
# 一直不停地聊时，攒够这么多句用户的话也先整理一次。
consolidate_max_turns = 24

[motions]
# 实时交互里的身体动作（2026-10-26）。没唤醒时的待机动作由嵌入式自己负责，这里只管醒着、在交流时：
# listening：用户开口约 0.7 秒后，从倾听组（倾听、点头、侧耳听、轻歪头）选一个；
# pauses：用户说话中间停顿约 0.4 秒（本地按麦克风音量判断，比云端判停早一秒多），轻点一下头；至少隔 4 秒；
# waiting：用户说完 1.2 秒她还没出声（多半在查天气这类工具），眼睛往上瞟一下，像在想；
# keep_listening：用户一直在说（长讲解、讲故事），每 6 秒左右再做一个倾听组的小动作，最多 6 次，说完就停（2026-11-20）；
# speaking：她说的每句话由决策模型选一个动作或不配，等扬声器快播到那句时再发；
# reactions：一轮对话让她心情明显变化，说完后由决策模型挑一个不出声的小动作。
# 真动作仍需 .env 的 ANNIE_ACTIONS_ENABLED=1；.env 的 ANNIE_INTERACTION_MOTIONS_ENABLED=1/0 覆盖本项。
# 2026-10-27 用户确认默认打开；电机声对识别与回声消除的影响、动作时机仍待真机统一测试。
enabled = true
listening = true
pauses = true
waiting = true
keep_listening = true
speaking = true
reactions = true
# 每轮回复最多配几个动作（含原有的自发表情）。
per_reply = 3

[vision]
companion_context_enabled = true
shared_attention_ttl_ms = 45000
realtime_on_query = false
attach_frame_to_main_brain = true
# 认出的熟人来到面前时主动打招呼；同一个人在这段时间内只打一次（分钟）。挥手不触发回应。
greet_known_cooldown_minutes = 30

[vision.intent]
# 用户要她现在去看（“你看看左边有什么”“你看到了什么”“你瞅瞅我拿的什么”）时：
# 有看向动作就先立即转头（action_trigger offset_ms=-1），等嵌入式 action.finished，
# 再经 reb_main 发 vision.intent 请视觉端看新画面，拿到描述才让实时模型回答；这一轮回复先压住。
# 语音和工作台打字的问法都算。协议见 docs/规范/视觉意图协议.md。2026-10-28 用户确认默认打开；
# 视觉端不回时每个视觉问题多等 deadline_ms 后按本地画面回答。.env 的 ANNIE_VISION_INTENT_ENABLED=1/0 覆盖本项。
enabled = true
# 让视觉端用哪个模型看：cloud = 阿里云视觉模型；local = 视觉端本地模型。
route = "cloud"
# 视觉端从收到请求起最多这么久内回描述（毫秒）；超时就按每秒一条的本地画面照常回答。
deadline_ms = 3500
# 看向动作的回执在动作时长之外最多再等多久（毫秒）；等不到也照常取画面。
action_receipt_extra_ms = 1200
# 转头和看图的这几秒先应一声（2026-11-19 用户确认）：实时模型按当前性格即兴说一句很短的话（每次不一样），
# 走原有 TTS 和嘴型，同时转头取景；看清后接着说看到的。.env 的 ANNIE_VISION_ACK_ENABLED=1/0 覆盖本项。
ack = true

[vision.intent.decision]
# 上面的句式规则认不出、但可能要看的问法（“有戴眼镜的人吗”“水桶在哪里”“你当前在什么场景下”），
# 交给决策模型（d3 在线时用 d3）判断要不要看、往哪看；回答内容仍来自视觉服务的描述（2026-11-03 用户确认）。
# 判断期间这一轮回复先压住；超时或出错就照常回答。.env 的 ANNIE_VISION_LOOK_DECISION_ENABLED=1/0 覆盖本项。
enabled = true
# cue = 只问带“看、哪、谁、有没有、戴、穿、位置、场景、左右上”这类词的句子；all = 规则没认出的每句都问。
scope = "cue"
# 最多等决策模型这么久（毫秒）。11-03 实测 d3 带图中位约 250 ms、最慢约 400 ms。
timeout_ms = 700
# d3 判断时附上该机器人 LiveKit 摄像头的最新一帧（.env 的 ANNIE_EXHIBIT_LIVEKIT_*）；
# 没配置或取不到 3 秒内的画面就只发文字。
image = true

[vision.face]
# 各机器人自己摄像头的视觉服务（人脸库接口）。配置了的机器人，对话里可以说“记住我，我叫…”和“忘掉我”。
# 视觉端 192.168.1.13 是 A 机器人（roomv2）的摄像头；B 机器人暂无。
api_urls = { "annie-a" = "http://192.168.1.13:8766" }
# 每次注册采集的样本数（视觉端 1–100，默认 18）
samples = 18

[recording]
# 现场原始音频（2026-11-20 用户要求）：按机器人、按会话存到 var/recordings/<日期>/<机器人>/，
# heard 是发给实时模型的 16kHz 麦克风声音（过了输入闸门和回声消除），said 是她播出的 24kHz 声音；
# 两个文件同一时刻开始、空档补静音，可以对齐着听，精确时间看运行日志。超过 keep_days 天的日期目录启动时删除。
# 展厅录观众声音请在现场设告示；.env 的 ANNIE_RECORDING_ENABLED=0/1 覆盖本项。
enabled = true
keep_days = 7

[voice_mimic]
# 学我说话（2026-11-20 用户要求）：本人明确同意后，用他刚说的 6～30 秒原声在阿里云复刻音色，
# 用他的声音说一句，说完立即删除云端音色、不入音色列表；只学正在对话的人。.env 的 ANNIE_VOICE_MIMIC_ENABLED=0/1 覆盖。
enabled = true

[dialect_follow]
# 方言跟随的补充（2026-11-20）：打开后①多认东北、山东、上海、湖南的方言词；②Windows 语种旁路
# （sidecars/annie-dialect-lid，FireRedLID）连续两句判成粤语 / 吴语 / 西南官话 / 湘语，就跟着说粤语 / 上海话 /
# 四川话 / 湖南话，连续两句普通话就改回来；北方官话、闽语不跟。话里的方言词和用户明确要求优先。
# 真人方言录音测完准确率前先关着；.env 的 ANNIE_DIALECT_FOLLOW_ENABLED=0/1 覆盖。
enabled = false
