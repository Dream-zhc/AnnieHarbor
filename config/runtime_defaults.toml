# V2 后续阶段仍需要的业务默认值。
# 当前Phase 2仅消费PCM准入所需配置；其余开关在对应阶段接入时再读取。

[features]
robot_output_enabled = true
asr_forward = true
web_forward = true
eye_enabled = true

[duplex]
enabled = false
mode = "wake"
wake_wait_ms = 5000
# 机器人说完后免唤醒继续听的时间（真实扬声器播完才开始计时）。
# 2026-10-22 实测 20 秒偏短（回复后 25～54 秒内又得喊名字），改为上限 30 秒。
followup_ms = 30000
# 决策模型判定“旁人之间在聊、不是对机器人说”时窗口重新计时，
# 但从窗口打开起最多继续听这么久，之后需要重新喊“小安妮”。
side_talk_listen_ms = 120000
pcm_source = "web"

[tts]
provider = "qwen_audio"
# V1 tts_voice=null，表示使用 provider 默认音色；TOML 不写 null。

[conversation]
history_turns = 20
# Realtime cloud inference window, separate from SQLite / local history.
# Provider default is 20; ordinary voice dialogue starts smaller (5–10 per Alibaba).
realtime_history_turns = 8
# Startup-only history injection uses characters, NOT an exact token limit.
realtime_restore_char_budget = 3000
turn_cooldown_ms = 1500
sensor_rearm_gap_ms = 3000

[vision]
companion_context_enabled = true
shared_attention_ttl_ms = 45000
realtime_on_query = false
attach_frame_to_main_brain = true
# 认出的熟人来到面前时主动打招呼；同一个人在这段时间内只打一次（分钟）。挥手不触发回应。
greet_known_cooldown_minutes = 30

[vision.face]
# 各机器人自己摄像头的视觉服务（人脸库接口）。配置了的机器人，对话里可以说“记住我，我叫…”和“忘掉我”。
# 视觉端 192.168.1.13 是 A 机器人（roomv2）的摄像头；B 机器人暂无。
api_urls = { "annie-a" = "http://192.168.1.13:8766" }
# 每次注册采集的样本数（视觉端 1–100，默认 18）
samples = 18
