[project]
name = "annie-brain"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["annie-core", "httpx>=0.28,<1", "sqlite-vec==0.1.9",
                "langmem==0.0.30", "langchain-openai>=1.1,<2", "langgraph>=1.2,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annie_brain"]

[tool.uv.sources]
annie-core = { workspace = true }
