[project]
name = "annie-web"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["annie-core", "fastapi>=0.115,<1", "pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annie_web"]

[tool.uv.sources]
annie-core = { workspace = true }
